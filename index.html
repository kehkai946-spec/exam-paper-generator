<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단권화 스터디 다이어리 - Modular Edition</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 분리된 CSS 디자인 파일 연결 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 필수 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>

    <header class="mobile-header no-print">
        <h1><i class="fa-solid fa-book-open"></i> Study Diary</h1>
        <div class="header-actions">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <div class="app-container">
        <!-- 좌측 메뉴바 -->
        <nav class="sidebar no-print" id="sidebar">
            <div class="brand"><i class="fa-solid fa-book-open" style="color:var(--accent-blue)"></i> 마스터 다이어리</div>
            
            <div class="menu-group">
                <div class="menu-label">생성 (Create)</div>
                <div class="menu-item active" onclick="navTo('concept')"><i class="fa-solid fa-file-pdf"></i> PDF 개념 요약</div>
                <div class="menu-item" onclick="navTo('grading')"><i class="fa-solid fa-marker"></i> OMR & 오답 해설</div>
            </div>

            <div class="menu-group">
                <div class="menu-label">관리 (Manage)</div>
                <div class="menu-item" onclick="navTo('dashboard')"><i class="fa-solid fa-chart-pie"></i> 단원별 지식 맵</div>
                <div class="menu-item" onclick="navTo('unified')"><i class="fa-solid fa-layer-group"></i> 단권화 & 모의고사 생성</div>
            </div>

            <div class="menu-group">
                <div class="menu-label" style="color:var(--accent-danger)">훈련 (Training)</div>
                <div class="menu-item" onclick="navTo('training')"><i class="fa-solid fa-dumbbell"></i> 오답 선지 OX 훈련</div>
            </div>

            <div class="settings-section">
                <label class="setting-label">테마 색상 선택</label>
                <select id="themeSelector" onchange="changeTheme(this.value)">
                    <option value="light">밝은 기본 (Light)</option>
                    <option value="dark">어두운 기본 (Dark)</option>
                    <option value="warmwood">웜 우드 (Warm Wood)</option>
                    <option value="pastel">코지 파스텔 (Cozy Pastel)</option>
                    <option value="paper">클래식 종이 (Classic Paper)</option>
                    <option value="sepianight">세피아 나이트 (Sepia Night)</option>
                </select>
                <label class="setting-label">Gemini API Key</label>
                <input type="password" id="sysApiKey" placeholder="API Key 입력" onchange="saveApiKey()">
            </div>
        </nav>

        <div class="main-wrapper">
            <main class="main-content" onclick="closeSidebarOutside()">
                
                <div class="page-header no-print">
                    <div class="page-title" id="pageTitleText"><i class="fa-solid fa-file-pdf"></i> PDF 개념 요약</div>
                    <div class="header-actions">
                        <button class="icon-btn" title="전체화면 집중 모드" onclick="toggleZenMode()"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>

                <!-- 페이지 1: 개념 요약 -->
                <section id="page-concept" class="page-section active">
                    <div class="panel no-print">
                        <div class="grid-2">
                            <div class="form-group">
                                <label>교재 PDF 첨부 (Drag & Drop)</label>
                                <div class="upload-zone" id="conceptDropZone" onclick="document.getElementById('conceptFile').click()">
                                    <i class="fa-solid fa-cloud-arrow-up" style="color:var(--accent-blue)"></i>
                                    <div class="upload-text">파일을 끌어다 놓으세요</div>
                                    <input type="file" id="conceptFile" accept=".pdf,image/*,.txt" onchange="handleFile('conceptFile', 'conceptPreview')">
                                </div>
                                <div id="conceptPreview" class="preview-area" style="background:var(--accent-blue)"></div>
                            </div>
                            <div class="form-group">
                                <label>레이아웃 & 태그</label>
                                <select id="conceptFormat" style="margin-bottom:15px;">
                                    <option value="auto">🤖 AI 자동 맞춤형</option>
                                    <option value="cornell">📋 표 형식 (코넬 노트)</option>
                                    <option value="bullet">📝 텍스트 형식 (개조식)</option>
                                </select>
                                <input type="text" id="conceptTags" placeholder="태그 (비워두면 AI 자동 생성)">
                            </div>
                        </div>
                        <div class="form-group" style="display:flex; gap:10px; align-items:flex-end;">
                            <div style="flex:1;">
                                <label>요약 지시사항 (음성 지원)</label>
                                <textarea id="conceptPrompt" rows="1" style="min-height:45px;" placeholder="요약할 내용이나 지시사항을 적어주세요."></textarea>
                            </div>
                            <button class="icon-btn mic-btn" id="micBtn" onclick="toggleSpeechRecognition()"><i class="fa-solid fa-microphone"></i></button>
                        </div>
                        
                        <div class="grid-2">
                            <button class="btn-primary" style="background:var(--accent-blue);" onclick="executeAI('concept', 'note')">노트 생성</button>
                            <button class="btn-primary" style="background:var(--text-main);" onclick="executeAI('concept', 'curriculum')">진도표 생성</button>
                        </div>
                        <div id="conceptLoader" class="loader"><div class="spinner"></div>문서를 분석하고 있습니다...</div>
                    </div>
                    
                    <div id="conceptResultWrapper" class="document-wrapper">
                        <div class="toolbar-chips no-print">
                            <div class="chip" onclick="toggleFocusMode('conceptResult')"><i class="fa-solid fa-eye-low-vision"></i> 포커스 모드</div>
                            <div class="chip" id="ttsBtnConcept" onclick="toggleTTS('conceptResult', 'ttsBtnConcept')"><i class="fa-solid fa-headphones"></i> 읽기</div>
                            <div class="chip" onclick="toggleCloze(this)"><i class="fa-solid fa-eye-slash"></i> 빈칸 암기</div>
                            <div class="chip" onclick="copyNotionMarkdown('conceptResult')"><i class="fa-brands fa-neos"></i> 복사</div>
                            <div class="chip active zen-btn" onclick="exportPDF('conceptResult', '개념요약노트')"><i class="fa-solid fa-arrow-up-right-from-square"></i> 굿노트 내보내기 (PDF)</div>
                        </div>
                        
                        <div id="conceptResult" class="document-view"></div>
                        
                        <div class="qna-section no-print">
                            <div class="chat-box" id="chatBoxConcept"><div class="chat-msg msg-ai">궁금한 점을 질문해 주세요.</div></div>
                            <div class="chat-input-area">
                                <input type="text" id="chatInputConcept" placeholder="질문을 입력하세요..." onkeypress="if(event.key === 'Enter') askTutor('concept')">
                                <button class="btn-primary" style="width:60px; padding:0; border-radius:8px;" onclick="askTutor('concept')"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 훈련소 및 다른 탭들의 기본 뼈대 (app.js에서 렌더링 제어) -->
                <section id="page-grading" class="page-section">
                    <!-- 생략 (app.js에서 동일 구조로 처리) -->
                </section>
                <section id="page-dashboard" class="page-section"></section>
                <section id="page-training" class="page-section"></section>
                <section id="page-unified" class="page-section"></section>

            </main>
        </div>
    </div>

    <!-- 플로팅 타이머 위젯 -->
    <div class="floating-widget no-print" id="floatingTimer">
        <div class="widget-drag-handle"><i class="fa-solid fa-grip-lines"></i></div>
        <div class="timer-time" id="timerDisplay">25:00</div>
        <div class="timer-controls">
            <button onclick="startTimer()"><i class="fa-solid fa-play"></i></button>
            <button onclick="pauseTimer()"><i class="fa-solid fa-pause"></i></button>
            <button onclick="resetTimer()"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <!-- 백색소음 -->
        <audio id="bgm" loop preload="none"><source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=heavy-rain-nature-sounds-8186.mp3" type="audio/mpeg"></audio>
        <button class="btn-bgm" id="bgmBtn" onclick="toggleBGM()"><i class="fa-solid fa-cloud-rain"></i> 집중 빗소리</button>
    </div>

    <!-- 분리된 자바스크립트 파일 연결 -->
    <script src="app.js"></script>
</body>
</html>
