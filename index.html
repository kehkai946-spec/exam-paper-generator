<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 맞춤형 시험지 생성기</title>
    <!-- 마크다운 변환 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 15px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        #loading { display: none; text-align: center; font-weight: bold; color: #007bff; margin-top: 15px; }
        #result { background: #fff; padding: 30px; border-radius: 12px; border-top: 5px solid #007bff; display: none; }
    </style>
</head>
<body>

    <h1>📝 AI 맞춤형 시험지 생성기</h1>

    <div class="card">
        <label>🔑 Gemini API 키 입력</label>
        <input type="password" id="apiKey" placeholder="Google AI Studio에서 발급받은 API 키를 입력하세요">
        
        <label>📚 출제 지시사항 (프롬프트)</label>
        <textarea id="promptInput" rows="5" placeholder="예: 주어진 범위에서 수능형 객관식 3문제와 내신형 서술형 1문제를 출제해 줘."></textarea>
        
        <label>🔗 참고 텍스트 (직접 복사-붙여넣기)</label>
        <textarea id="contextInput" rows="4" placeholder="시험 범위에 해당하는 텍스트나 지문을 여기에 붙여넣으세요."></textarea>

        <button onclick="generateExam()">🚀 시험지 생성 시작</button>
        <div id="loading">AI가 완벽한 한국어 시험지를 출제하고 있습니다... ⏳</div>
    </div>

    <div id="result" class="card"></div>

    <script>
        async function generateExam() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('promptInput').value;
            const context = document.getElementById('contextInput').value;
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');

            if (!apiKey || !prompt) {
                alert("API 키와 출제 지시사항을 모두 입력해주세요!");
                return;
            }

            loading.style.display = "block";
            resultDiv.style.display = "none";

            // 시스템 프롬프트 + 사용자 프롬프트 결합
            const finalPrompt = `당신은 대한민국 최고의 시험 출제 위원입니다. 
다음 지시사항과 텍스트를 바탕으로 완벽한 한국어로 문제를 출제하세요.
문제, 정답, 상세한 해설(오답 노트 포함)을 명확히 구분하여 마크다운으로 작성하세요.

[출제 지시사항]: ${prompt}
[참고 텍스트]: ${context}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiText = data.candidates[0].content.parts[0].text;
                resultDiv.innerHTML = marked.parse(aiText); // 마크다운 렌더링
                resultDiv.style.display = "block";

            } catch (error) {
                alert("오류가 발생했습니다: " + error.message);
            } finally {
                loading.style.display = "none";
            }
        }
    </script>
</body>
</html>
