<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단권화 스터디 다이어리 V31 - Solid Foundation & iPad Fixed</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <style>
        /* 테마 설정 */
        :root[data-theme="light"] { --bg-body: #F4F7FA; --bg-surface: #FFFFFF; --text-main: #1E293B; --text-sub: #64748B; --accent-primary: #3B82F6; --accent-danger: #EF4444; --border-soft: #E2E8F0; --table-head: #F8FAFC; --table-row: #FFFFFF; }
        :root[data-theme="dark"] { --bg-body: #0F172A; --bg-surface: #1E293B; --text-main: #F8FAFC; --text-sub: #94A3B8; --accent-primary: #3B82F6; --accent-danger: #EF4444; --border-soft: #334155; --table-head: #0F172A; --table-row: #1E293B; }
        :root[data-theme="warmwood"] { --bg-body: #FDFBF7; --bg-surface: #F4EFE6; --text-main: #3E3124; --text-sub: #7A6953; --accent-primary: #8B5A2B; --accent-danger: #C0392B; --border-soft: #E6DBCB; --table-head: #EBE3D5; --table-row: #F4EFE6; }
        :root[data-theme="pastel"] { --bg-body: #FFF5F8; --bg-surface: #FFFFFF; --text-main: #4A4A4A; --text-sub: #888888; --accent-primary: #FFA6C9; --accent-danger: #FF8BA7; --border-soft: #FFE1E8; --table-head: #FFF0F5; --table-row: #FFFFFF; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, color 0.2s; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; min-height: 100dvh; overflow-x: hidden; line-height: 1.6; }
        
        body.zen-mode .sidebar, body.zen-mode .mobile-header, body.zen-mode .panel:not(.zen-exempt), body.zen-mode .page-header-left, body.zen-mode .toolbar-chips .chip:not(.zen-btn) { display: none !important; }
        body.zen-mode .app-container { max-width: 1000px; margin: 0 auto; }
        body.zen-mode .main-content { padding: 20px; }
        body.zen-mode .document-view { box-shadow: none; border: 1px solid transparent; background: transparent; }

        .mobile-header { display: none; background: var(--bg-surface); padding: 16px 24px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; z-index: 100; }
        .mobile-header h1 { font-size: 1.2rem; font-weight: 800; color: var(--accent-primary); }
        .menu-toggle { background: none; border: none; font-size: 1.4rem; color: var(--accent-primary); cursor: pointer; }

        .app-container { display: flex; flex: 1; position: relative; max-width: 1500px; margin: 0 auto; width: 100%; }

        .sidebar { width: 260px; background: var(--bg-surface); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; padding: 30px 0; z-index: 50; }
        .brand { padding: 0 30px 30px; font-size: 1.2rem; font-weight: 800; color: var(--accent-primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        .menu-group { margin-bottom: 20px; }
        .menu-label { padding: 0 30px; font-size: 0.75rem; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
        .menu-item { padding: 12px 30px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-main); font-size: 0.95rem; position: relative; }
        .menu-item:hover { color: var(--accent-primary); }
        .menu-item.active { color: var(--accent-primary); background: rgba(59, 130, 246, 0.05); font-weight: 700; }
        .menu-item.active::before { content: ''; position: absolute; left: 0; top: 20%; height: 60%; width: 4px; background: var(--accent-primary); border-radius: 0 4px 4px 0; }
        
        .settings-section { margin-top: auto; padding: 20px 30px; border-top: 1px solid var(--border-soft); }
        .settings-section select, .settings-section input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-soft); border-radius: 8px; font-size: 0.85rem; background: var(--bg-body); color: var(--text-main); outline: none; margin-bottom: 10px; }

        /* 🔥 위젯 드래그 (아이패드 터치 대응 완료) */
        .floating-widget { position: fixed; bottom: 30px; right: 30px; width: 220px; background: var(--bg-surface); padding: 15px; border-radius: 16px; border: 1px solid var(--border-soft); box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1000; user-select: none; }
        .widget-drag-handle { width: 100%; height: 25px; display: flex; justify-content: center; align-items: center; margin-bottom: 5px; color: var(--text-sub); cursor: grab; background: rgba(0,0,0,0.02); border-radius: 8px; }
        .widget-drag-handle:active { cursor: grabbing; }
        .timer-time { font-size: 2rem; font-weight: 900; margin-bottom: 10px; text-align: center; color: var(--text-main); font-variant-numeric: tabular-nums; }
        .timer-controls { display: flex; justify-content: center; gap: 8px; }
        .timer-controls button { background: var(--bg-body); border: 1px solid var(--border-soft); color: var(--text-main); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .btn-bgm { margin-top: 10px; width: 100%; padding: 8px; font-size: 0.85rem; background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); border-radius: 8px; cursor: pointer; }
        .btn-bgm.playing { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }

        .main-wrapper { flex: 1; display: flex; overflow: hidden; }
        .main-content { flex: 1; padding: 35px 50px; width: 100%; overflow-y: auto; height: 100dvh; }
        
        .page-section { display: none; }
        .page-section.active { display: block; }

        .page-header { margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; }
        .page-title { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: var(--bg-surface); border: 1px solid var(--border-soft); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-main); cursor: pointer; }

        .panel { background: var(--bg-surface); padding: 30px; border-radius: 16px; border: 1px solid var(--border-soft); margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
        
        input[type="text"], textarea, select { width: 100%; padding: 14px 16px; border: 1px solid var(--border-soft); border-radius: 10px; font-family: inherit; font-size: 0.95rem; background: var(--bg-body); color: var(--text-main); outline: none; resize: none; }
        
        .upload-zone { border: 2px dashed var(--text-sub); background: var(--bg-body); padding: 25px 15px; text-align: center; border-radius: 10px; cursor: pointer; position: relative; }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .btn-primary { background: var(--text-main); color: var(--bg-surface); border: none; padding: 16px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; }
        
        .loader { display: none; text-align: center; padding: 20px; font-size: 0.95rem; font-weight: 700; color: var(--accent-primary); }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border-soft); border-radius: 50%; border-top-color: currentColor; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .document-wrapper { display: none; margin-top: 20px; }
        .toolbar-chips { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .chip { background: var(--bg-surface); border: 1px solid var(--border-soft); color: var(--text-main); padding: 8px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .chip.active { background: var(--text-main); color: var(--bg-surface); }
        
        .document-view { background: var(--bg-surface); padding: 50px; border-radius: 16px; border: 1px solid var(--border-soft); font-size: 1.05rem; color: var(--text-main); }
        
        /* 🔥 파란색 배경 완전 삭제. 깔끔한 글씨 색상 유지 */
        .document-view strong { color: var(--text-main); font-weight: 800; background: none; }
        
        /* 🔥 표 모바일 가로 스크롤 허용 (화면 안 깨짐) */
        .table-responsive { width: 100%; overflow-x: auto; margin: 20px 0; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--table-row); -webkit-overflow-scrolling: touch; }
        .document-view table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .document-view th, .document-view td { padding: 12px; border: 1px solid var(--border-soft); line-height: 1.6; }
        .document-view th { background: var(--table-head); font-weight: 800; }
        .document-view td:first-child { font-weight: 700; background: var(--table-head); }

        .book-cover { text-align: center; padding: 100px 40px; background: var(--table-head); border: 2px solid var(--border-soft); border-radius: 16px; margin-bottom: 40px; }
        .mock-exam-title { text-align: center; font-size: 1.8rem; font-weight: 900; margin: 30px 0; border-bottom: 3px solid var(--text-main); padding-bottom: 15px; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        #mermaidTree { background: var(--bg-surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border-soft); min-height: 250px; display: flex; justify-content: center; align-items: center; overflow-x: auto; }
        
        .archive-item { padding: 15px 20px; border: 1px solid var(--border-soft); border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); cursor: pointer; }
        
        .omr-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: var(--bg-body); padding: 20px; border-radius: 12px; }
        .omr-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); padding: 5px 15px; border-radius: 8px; border: 1px solid var(--border-soft); }
        .omr-bubble { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .omr-bubble.selected { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }

        .chat-box { background: var(--bg-body); border: 1px solid var(--border-soft); border-radius: 12px; padding: 15px; max-height: 300px; overflow-y: auto; margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { padding: 10px 15px; border-radius: 12px; max-width: 85%; font-size: 0.9rem; }
        .msg-user { background: var(--accent-primary); color: white; align-self: flex-end; }
        .msg-ai { background: var(--bg-surface); border: 1px solid var(--border-soft); align-self: flex-start; }

        @media (max-width: 1024px) {
            .mobile-header { display: flex; }
            .sidebar { position: fixed; left: -260px; top: 0; height: 100%; box-shadow: 10px 0 30px rgba(0,0,0,0.3); }
            .sidebar.open { transform: translateX(260px); }
            .main-content { padding: 15px; }
            .omr-container { grid-template-columns: 1fr; }
            .floating-widget { bottom: 15px; right: 15px; width: 180px; padding: 10px; }
            .timer-time { font-size: 1.5rem; }
            .document-view { padding: 20px; } 
        }
    </style>
</head>
<body>

    <header class="mobile-header">
        <h1><i class="fa-solid fa-book-open"></i> Study Diary</h1>
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="brand"><i class="fa-solid fa-book-open" style="color:var(--accent-primary)"></i> V31 Solid</div>
            
            <div class="menu-group">
                <div class="menu-item active" onclick="navTo('concept')"><i class="fa-solid fa-file-pdf"></i> PDF 개념 요약</div>
                <div class="menu-item" onclick="navTo('grading')"><i class="fa-solid fa-marker"></i> OMR & 오답 해설</div>
                <div class="menu-item" onclick="navTo('dashboard')"><i class="fa-solid fa-chart-pie"></i> 단원별 지식 맵</div>
                <div class="menu-item" onclick="navTo('unified')"><i class="fa-solid fa-layer-group"></i> 모의고사 생성</div>
            </div>

            <div class="settings-section">
                <select id="themeSelector" onchange="changeTheme(this.value)">
                    <option value="light">밝은 기본 (Light)</option>
                    <option value="dark">어두운 기본 (Dark)</option>
                    <option value="warmwood">웜 우드 (Warm Wood)</option>
                    <option value="pastel">코지 파스텔 (Cozy Pastel)</option>
                </select>
                <input type="password" id="sysApiKey" placeholder="API Key 입력" onchange="saveApiKey()">
            </div>
        </nav>

        <div class="main-wrapper">
            <main class="main-content" onclick="closeSidebarOutside()">
                
                <div class="page-header">
                    <div class="page-title" id="pageTitleText"><i class="fa-solid fa-file-pdf"></i> PDF 개념 요약</div>
                    <button class="icon-btn" onclick="toggleZenMode()"><i class="fa-solid fa-expand"></i></button>
                </div>

                <!-- 1. 코넬 탭 -->
                <section id="page-concept" class="page-section active">
                    <div class="panel">
                        <div class="grid-2">
                            <div class="form-group">
                                <label>교재 이미지/PDF 첨부</label>
                                <div class="upload-zone" onclick="document.getElementById('conceptFile').click()">
                                    <i class="fa-solid fa-cloud-arrow-up"></i>
                                    <div class="upload-text" id="conceptPreview">클릭하여 파일 첨부</div>
                                    <input type="file" id="conceptFile" accept=".pdf,image/*,.txt" onchange="handleFile('conceptFile', 'conceptPreview')">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>레이아웃 선택</label>
                                <select id="conceptFormat" style="margin-bottom:10px;">
                                    <option value="auto">🤖 AI 자동 맞춤형</option>
                                    <option value="cornell">📋 표 형식 (코넬 노트)</option>
                                    <option value="bullet">📝 텍스트 형식 (개조식)</option>
                                </select>
                                <input type="text" id="conceptTags" placeholder="태그 (예: 국어, 문학)">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>요약 지시사항</label>
                            <textarea id="conceptPrompt" rows="2" placeholder="요약할 텍스트를 붙여넣거나 특별한 지시사항을 적어주세요."></textarea>
                        </div>
                        <button class="btn-primary" onclick="executeAI('concept', 'note')">노트 생성하기</button>
                        <div id="conceptLoader" class="loader"><div class="spinner"></div>문서를 꼼꼼히 분석하고 있습니다...</div>
                    </div>
                    
                    <div id="conceptResultWrapper" class="document-wrapper">
                        <div class="toolbar-chips">
                            <!-- 🔥 TTS 및 PDF 다운로드 기능 안정화 -->
                            <div class="chip" id="ttsBtnConcept" onclick="playAudioTTS('conceptResult', 'ttsBtnConcept')"><i class="fa-solid fa-headphones"></i> 소리내어 읽기</div>
                            <div class="chip" onclick="copyNotionMarkdown('conceptResult')"><i class="fa-brands fa-neos"></i> 복사</div>
                            <div class="chip active zen-btn" onclick="downloadPDF_A4('conceptResult', '정리노트')"><i class="fa-solid fa-file-pdf"></i> 완벽 PDF 저장</div>
                        </div>
                        <div id="conceptResult" class="document-view"></div>
                        
                        <div class="chat-box" id="chatBoxConcept" style="margin-top:20px;">
                            <div class="chat-msg msg-ai">궁금한 점을 질문해 주세요.</div>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="chatInputConcept" placeholder="질문을 입력하세요..." onkeypress="if(event.key === 'Enter') askTutor('concept')">
                            <button class="btn-primary" style="width:60px; padding:0;" onclick="askTutor('concept')"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </section>

                <!-- 2. OMR 탭 -->
                <section id="page-grading" class="page-section">
                    <div class="panel">
                        <div class="grid-2">
                            <div class="form-group">
                                <label>문제지 첨부</label>
                                <div class="upload-zone" onclick="document.getElementById('gradeQuestFile').click()">
                                    <div class="upload-text" id="gradeQuestPreview">클릭하여 파일 첨부</div>
                                    <input type="file" id="gradeQuestFile" accept="image/*,.pdf" onchange="handleFile('gradeQuestFile', 'gradeQuestPreview')">
                                </div>
                            </div>
                            <div class="form-group"><label>태그</label><input type="text" id="gradeTags"></div>
                        </div>
                        <div class="form-group">
                            <label>OMR 마킹</label>
                            <div id="visualOMR" class="omr-container"></div>
                            <input type="hidden" id="omrAnswers">
                        </div>
                        <button class="btn-primary" style="background:var(--accent-primary);" onclick="executeAI('grading', 'score')">가채점 및 오답 분석</button>
                        <div id="gradeLoader" class="loader"><div class="spinner"></div>오답을 분석 중입니다...</div>
                    </div>
                    <div id="gradeResultWrapper" class="document-wrapper">
                        <div class="toolbar-chips">
                            <div class="chip active zen-btn" onclick="downloadPDF_A4('gradeResult', '오답분석')"><i class="fa-solid fa-file-pdf"></i> PDF 저장</div>
                        </div>
                        <div id="gradeResult" class="document-view"></div>
                    </div>
                </section>

                <!-- 3. 대시보드 -->
                <section id="page-dashboard" class="page-section">
                    <div class="dashboard-grid">
                        <div class="panel" style="padding:20px;">
                            <label style="font-weight:700; margin-bottom:15px; display:block;"><i class="fa-solid fa-network-wired"></i> 지식 맵</label>
                            <div id="mermaidTree"></div>
                        </div>
                        <div class="panel" style="padding:20px;">
                            <label style="font-weight:700; margin-bottom:15px; display:block;">보관함</label>
                            <div id="historyList">기록이 없습니다.</div>
                        </div>
                    </div>
                </section>

                <!-- 4. 모의고사 출판 -->
                <section id="page-unified" class="page-section">
                    <div class="panel">
                        <p style="margin-bottom:15px; font-weight:700;">📝 병합할 노트를 1개 이상 선택하세요</p>
                        <div id="unifiedSelectionList" style="max-height:250px; overflow-y:auto; margin-bottom: 20px; border:1px solid var(--border-soft); border-radius:10px; padding:10px;"></div>
                        
                        <div class="grid-2">
                            <button class="btn-primary" onclick="executeUnifiedNote('book')">단권화 병합</button>
                            <button class="btn-primary" style="background:var(--accent-danger);" onclick="executeUnifiedNote('exam')">실전 모의고사 생성</button>
                        </div>
                        <div id="unifiedLoader" class="loader"><div class="spinner"></div>요청 중입니다...</div>
                    </div>
                    <div id="unifiedResultWrapper" class="document-wrapper">
                        <div class="toolbar-chips">
                            <div class="chip active zen-btn" onclick="downloadPDF_A4('unifiedResult', '병합자료')"><i class="fa-solid fa-file-pdf"></i> 파일로 다운로드</div>
                        </div>
                        <div id="unifiedResult" class="document-view" style="padding: 0;"></div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- 🔥 완벽하게 터치/드래그가 지원되는 위젯 -->
    <div class="floating-widget" id="floatingTimer">
        <div class="widget-drag-handle" id="dragHandler"><i class="fa-solid fa-grip-lines"></i></div>
        <div class="timer-time" id="timerDisplay">25:00</div>
        <div class="timer-controls">
            <button onclick="startTimer()"><i class="fa-solid fa-play"></i></button>
            <button onclick="pauseTimer()"><i class="fa-solid fa-pause"></i></button>
            <button onclick="resetTimer()"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <!-- 🔥 모바일 자동재생 차단을 우회하기 위해 Audio 객체를 JS에서 동적 생성합니다 -->
        <button class="btn-bgm" id="bgmBtn" onclick="toggleRainBGM()"><i class="fa-solid fa-cloud-rain"></i> 빗소리 재생</button>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'base' });

        // 🔥 1. 아이패드 터치 완벽 지원 드래그 로직
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            var handle = document.getElementById("dragHandler");
            
            // PC 마우스 이벤트
            handle.onmousedown = dragMouseDown;
            // 모바일/iPad 터치 이벤트
            handle.ontouchstart = dragTouchStart;

            function dragMouseDown(e) { e = e || window.event; e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
            function dragTouchStart(e) { e = e || window.event; pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY; document.ontouchend = closeDragElement; document.ontouchmove = elementTouchDrag; }
            
            function elementDrag(e) { e = e || window.event; e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px"; elmnt.style.bottom = "auto"; elmnt.style.right = "auto"; }
            function elementTouchDrag(e) { e = e || window.event; pos1 = pos3 - e.touches[0].clientX; pos2 = pos4 - e.touches[0].clientY; pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY; elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px"; elmnt.style.bottom = "auto"; elmnt.style.right = "auto"; }
            
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
        }

        window.onload = () => {
            const savedKey = localStorage.getItem('geminiApiKey');
            if (savedKey) document.getElementById('sysApiKey').value = savedKey;
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeSelector').value = savedTheme;
            
            renderOMR();
            dragElement(document.getElementById("floatingTimer"));
        };

        function saveApiKey() { localStorage.setItem('geminiApiKey', document.getElementById('sysApiKey').value); }
        function changeTheme(themeValue) { document.documentElement.setAttribute('data-theme', themeValue); localStorage.setItem('theme', themeValue); }
        function toggleZenMode() { document.body.classList.toggle('zen-mode'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function closeSidebarOutside() { if(window.innerWidth <= 1024) document.getElementById('sidebar').classList.remove('open'); }

        function handleFile(inputId, previewId) {
            const file = document.getElementById(inputId).files[0];

        // 🔥 2. 안정적인 BGM 재생 (iOS 오디오 정책 우회)
        let audioObj = null;
        let isBgmPlaying = false;
        function toggleRainBGM() {
            const btn = document.getElementById('bgmBtn');
            if (!audioObj) {
                // 사용자가 직접 버튼을 클릭했을 때(User Gesture) 안전한 링크로 Audio 객체 생성
                audioObj = new Audio("https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=heavy-rain-nature-sounds-8186.mp3");
                audioObj.loop = true;
            }
            
            if (isBgmPlaying) {

            } else {

                isBgmPlaying = true;
                btn.classList.add('playing');
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> 재생 중지';

        let timerInterval; let timeLeft = 25 * 60; let isTimerRunning = false;
        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }
        function startTimer() { if(!isTimerRunning) { isTimerRunning = true; timerInterval = setInterval(() => { if(timeLeft > 0) { timeLeft--; updateTimerDisplay(); } else { pauseTimer(); alert("뽀모도로 완료!"); } }, 1000); } }
        function pauseTimer() { clearInterval(timerInterval); isTimerRunning = false; }
        function resetTimer() { pauseTimer(); timeLeft = 25 * 60; updateTimerDisplay(); }

        let currentRawMarkdown = ""; 
        function copyNotionMarkdown(elementId) {
            if(!currentRawMarkdown) return;
            navigator.clipboard.writeText(currentRawMarkdown).then(() => alert("마크다운 텍스트가 클립보드에 복사되었습니다."));
        }

        let userAnswers = {}; 
        function renderOMR() {
            const container = document.getElementById('visualOMR'); if(!container) return;
            let html = '';
            for(let i=1; i<=20; i++) {
                html += `<div class="omr-row"><div class="omr-qnum">${i}.</div><div style="display:flex; gap:10px;">`;

        function selectOMR(q, c) {

        function navTo(pageId) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            closeSidebarOutside();
            
            document.body.classList.remove('zen-mode'); 
            const titles = {'concept': 'PDF 개념 요약', 'grading': 'OMR & 오답 해설', 'dashboard': '지식 맵 & 보관함', 'unified': '단권화 생성'};

        function applyTableWrapper(element) {
            element.querySelectorAll('table').forEach(table => {
                if (table.parentElement.classList.contains('table-responsive')) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'table-responsive';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            });
        }

        // 🔥 3. iOS 음성 읽기 (TTS) 끊김 현상 해결 (Chunking)
        let isTTSPlaying = false;
        function playAudioTTS(elementId, btnId) {
            const btn = document.getElementById(btnId);
            if(isTTSPlaying || window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                isTTSPlaying = false;
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fa-solid fa-headphones"></i> 소리내어 읽기';
                return;
            }

            const rawText = document.getElementById(elementId).innerText;
            if(!rawText) return alert("읽을 텍스트가 없습니다.");

            // Safari는 긴 텍스트를 무시하므로 문장 단위로 쪼개서 읽힙니다.
            const sentences = rawText.match(/[^.!?]+[.!?]+/g) || [rawText];
            let currentIndex = 0;
            isTTSPlaying = true;
            btn.classList.add('active');
            btn.innerHTML = '<i class="fa-solid fa-stop"></i> 중지';

            function speakNextSentence() {
                if (currentIndex >= sentences.length || !isTTSPlaying) {
                    isTTSPlaying = false;
                    btn.classList.remove('active');
                    btn.innerHTML = '<i class="fa-solid fa-headphones"></i> 소리내어 읽기';
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(sentences[currentIndex]);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.2;
                utterance.onend = () => { currentIndex++; speakNextSentence(); };
                utterance.onerror = () => { isTTSPlaying = false; btn.classList.remove('active'); };
                window.speechSynthesis.speak(utterance);
            }
            speakNextSentence();
        }

        // 🔥 4. [방안 A 적용] 절대 짤리지 않는 '히든 A4 캔버스' PDF 추출 엔진
        async function downloadPDF_A4(elementId, fileName) {
            const originalElement = document.getElementById(elementId);
            const loaderId = elementId.replace('Result', 'Loader');
            const loader = document.getElementById(loaderId);
            
            if(loader) { loader.style.display = 'block'; loader.innerHTML = '<div class="spinner"></div>A4 문서로 변환 중입니다 (기기 성능에 따라 5~10초 소요)...'; }

            // 1) 렌더링에 방해되는 요소 숨김
            const noPrints = originalElement.querySelectorAll('.no-print, .toolbar-chips');
            noPrints.forEach(el => el.style.display = 'none');

            // 2) 원본 보존을 위해 클론(복제본) 생성
            const clone = originalElement.cloneNode(true);
            const container = document.createElement('div');
            container.appendChild(clone);
            
            // 3) 🔥 여기가 핵심: 화면 밖(-9999px)에 무조건 폭 794px(A4 가로비율)짜리 완벽한 가상 도화지를 깝니다.
            container.style.position = 'absolute';
            container.style.top = '-9999px';
            container.style.left = '0'; // iOS 버그를 피하기 위해 left는 0으로 하되 overflow-x 숨김 처리
            container.style.width = '794px'; 
            container.style.padding = '30px';
            container.style.background = '#ffffff'; // PDF는 무조건 흰색 바탕
            container.style.color = '#000000'; // 강제 검은 글씨
            container.style.zIndex = '-9999';
            
            // 표나 스크롤 박스가 A4 폭(794px)을 넘어가지 못하게 강제 압축 및 줄바꿈
            const tables = container.querySelectorAll('table, .table-responsive');
            tables.forEach(table => {
                table.style.width = '100%';
                table.style.maxWidth = '100%';
                table.style.overflowX = 'visible'; // 캡처 시엔 스크롤 없애고 다 풀어서 그림
                table.style.tableLayout = 'fixed';
                table.style.wordBreak = 'break-all'; // 글자 강제 줄바꿈
            });

            document.body.appendChild(container);

            // 4) html2pdf 옵션: 아이패드에서도 해상도(scale)를 2로 줘서 초고화질 유지
            const opt = {
                margin:       [10, 10, 10, 10], 
                filename:     `${fileName}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    windowWidth: 794, 
                    scrollY: 0, 
                    logging: false 
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] } 
            };
            
            try {
                // 백그라운드 캡처 후 직접 다운로드 트리거
                await html2pdf().set(opt).from(container).save();
            } catch (error) {
                alert("PDF 생성 중 오류 발생: 문서를 조금 나누어서 시도해주세요.");
            } finally {
                document.body.removeChild(container);
                noPrints.forEach(el => el.style.display = '');
                if(loader) loader.style.display = 'none';
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = () => resolve({ data: reader.result.split(',')[1], mimeType: file.type });
                reader.onerror = error => reject(error);
            });
        }

        const formattingRules = `
[마크다운 필수 규칙]
1. 하이픈(-) 금지. 리스트는 별표(*)나 숫자 사용.
2. 수학 수식은 무조건 $$수식$$ 형태의 디스플레이 수식만 사용. ($ 단일사용 금지)
3. 텍스트 강조(볼드체)는 문장 전체가 아닌, 핵심 개념어에만 적용할 것.`;

        async function callGeminiAPI(apiKey, prompt, files = [], loaderId = null) {
            let requestParts = [{ text: prompt }];
            files.forEach(f => requestParts.push({ inlineData: { data: f.data, mimeType: f.mimeType } }));
            const options = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: requestParts }], generationConfig: { temperature: 0.7 } }) };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, options);
                if (!response.ok) throw new Error("구글 AI 서버 통신 에러 (API Key나 할당량을 확인하세요)");
                const data = await response.json(); 
                if(data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                throw e;
            }
        }

        async function executeAI(mode, subMode) {
            const apiKey = document.getElementById('sysApiKey').value;
            if (!apiKey) return alert("좌측 하단 메뉴에서 Gemini API Key를 입력하세요.");

            const loaderId = mode + 'Loader'; const resultWrapper = document.getElementById(mode + 'ResultWrapper'); const resultBox = document.getElementById(mode + 'Result');
            document.getElementById(loaderId).style.display = 'block'; resultWrapper.style.display = 'none';

            let prompt = "", title = "", filesToProcess = [];

            try {
                if (mode === 'concept') {
                    const inputPrompt = document.getElementById('conceptPrompt').value;
                    const file = document.getElementById('conceptFile').files[0];
                    const formatChoice = document.getElementById('conceptFormat').value; 
                    if (!inputPrompt && !file) throw new Error("분석할 텍스트나 파일이 필요합니다.");
                    if (file) filesToProcess.push(await fileToBase64(file));
                    
                    let styleIns = formatChoice === "cornell" ? "2열 표(Table) 형식" : formatChoice === "bullet" ? "개조식" : "AI 자동 판단";
                    prompt = `[자료]: ${inputPrompt}\n[레이아웃]: ${styleIns}\n자료를 깊이 있게 분석하여 요약 노트를 작성하세요.\n${formattingRules}`;
                    title = `[개념 요약] 노트`;
                }
                else if (mode === 'grading') {
                    const qFile = document.getElementById('gradeQuestFile').files[0];
                    const omrInput = document.getElementById('omrAnswers').value;
                    if (!qFile) throw new Error("문제지 파일을 첨부해주세요.");
                    filesToProcess.push(await fileToBase64(qFile));
                    
                    if (!omrInput) throw new Error("OMR 마킹을 입력해주세요.");
                    prompt = `[학생 마킹 답안]: ${omrInput}\n채점 결과와 오답 상세 해설을 제공하세요.\n${formattingRules}`;
                    title = `[오답 해설] 리포트`;
                }

                const aiText = await callGeminiAPI(apiKey, prompt, filesToProcess, loaderId);
                currentContext = aiText; currentRawMarkdown = aiText; 
                
                resultBox.innerHTML = marked.parse(aiText);
                applyTableWrapper(resultBox); // 모바일 표 짤림 방지
                resultWrapper.style.display = 'block';
                if (window.MathJax) MathJax.typesetPromise([resultBox]);
                
                saveHistory(title, [], aiText);

            } catch (error) { 
                resultBox.innerHTML = `<div style="color:red; font-weight:bold;">🚨 에러: ${error.message}</div>`; 
                resultWrapper.style.display = 'block'; 
            } 
            finally { document.getElementById(loaderId).style.display = 'none'; }
        }

        async function askTutor(mode) {
            const apiKey = document.getElementById('sysApiKey').value;
            const inputField = document.getElementById('chatInput' + (mode === 'concept' ? 'Concept' : 'Grade'));
            const chatBox = document.getElementById('chatBox' + (mode === 'concept' ? 'Concept' : 'Grade'));
            const question = inputField.value.trim();
            if (!apiKey || !question) return;

            chatBox.innerHTML += `<div class="chat-msg msg-user">${question}</div>`; inputField.value = ""; chatBox.scrollTop = chatBox.scrollHeight;
            const loadingId = "load-" + Date.now(); chatBox.innerHTML += `<div class="chat-msg msg-ai" id="${loadingId}">...</div>`;
            const prompt = `[학습 자료]:\n${currentContext}\n\n[학생 질문]: ${question}\n위 자료 맥락 안에서 답변하세요.\n${formattingRules}`;

            try {
                const answerText = await callGeminiAPI(apiKey, prompt, []);
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="chat-msg msg-ai">${marked.parse(answerText)}</div>`;
                if (window.MathJax) MathJax.typesetPromise([chatBox]);
            } catch (error) { document.getElementById(loadingId).remove(); chatBox.innerHTML += `<div style="color:red;">에러 발생</div>`; }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function saveHistory(title, tags, content) {
            let history = JSON.parse(localStorage.getItem('cozyArchive') || '[]');
            history.unshift({ id: Date.now(), title: title, tags: tags, content: content });
            if (history.length > 50) history.pop();
            localStorage.setItem('cozyArchive', JSON.stringify(history));
        }

        function loadHistory() {
            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('cozyArchive') || '[]');
            if (history.length === 0) return list.innerHTML = "<div style='color:var(--text-sub);'>저장된 기록이 없습니다.</div>";
            list.innerHTML = history.map(item => `
                <div class="archive-item" onclick="viewHistory(${item.id})">
                    <span style="font-weight:700;">${item.title}</span>
                    <button style="border:none; background:transparent; padding:5px; color:#EF4444;" onclick="deleteHistory(${item.id}, event)"><i class="fa-solid fa-trash"></i></button>
                </div>`).join('');
        }

        function deleteHistory(id, event) {
            event.stopPropagation();
            if(!confirm("이 노트를 삭제하시겠습니까?")) return;
            let history = JSON.parse(localStorage.getItem('cozyArchive') || '[]');
            history = history.filter(h => h.id !== id);
            localStorage.setItem('cozyArchive', JSON.stringify(history));
            loadHistory(); renderKnowledgeTree(); loadUnifiedSelection();
        }

        function viewHistory(id) {
            let history = JSON.parse(localStorage.getItem('cozyArchive') || '[]');
            const item = history.find(h => h.id === id);
            if (item) {
                navTo('concept');
                document.getElementById('conceptResult').innerHTML = marked.parse(item.content);
                applyTableWrapper(document.getElementById('conceptResult'));
                document.getElementById('conceptResultWrapper').style.display = 'block';
                currentContext = item.content; currentRawMarkdown = item.content;
                if (window.MathJax) MathJax.typesetPromise([document.getElementById('conceptResult')]);
                window.scrollTo({ top: 0 });
            }
        }

        function renderKnowledgeTree() {
            let history = JSON.parse(localStorage.getItem('cozyArchive') || '[]');
            let treeContainer = document.getElementById('mermaidTree');
            if (history.length === 0) return treeContainer.innerHTML = "<div style='color:var(--text-sub);'>데이터가 없습니다.</div>";
            let graphDef = "graph TD\n Root((지식 코어))";
            history.forEach((item, index) => { graphDef += `\n Root --> node_${index}("${item.title.substring(0,15)}")`; });
            treeContainer.innerHTML = `<div class="mermaid">${graphDef}</div>`;
            mermaid.init(undefined, document.querySelectorAll('.mermaid'));
        }

        function loadUnifiedSelection() {
            const list = document.getElementById('unifiedSelectionList');
            let history = JSON.parse(localStorage.getItem('cozyArchive') || '[]');
            if (history.length === 0) return list.innerHTML = "<div style='padding:10px;'>보관함이 비어있습니다.</div>";
            list.innerHTML = history.map(item => `
                <label style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid var(--border-soft); cursor:pointer;">
                    <input type="checkbox" class="unifiedSelectionList-checkbox" value="${item.id}" style="width:18px; height:18px;">
                    <span style="font-weight:600;">${item.title}</span>
                </label>`).join('');
        }

        async function executeUnifiedNote(type) {
            const apiKey = document.getElementById('sysApiKey').value;
            if (!apiKey) return alert("API Key를 입력해주세요!");
            
            const checkboxes = document.querySelectorAll('.unifiedSelectionList-checkbox:checked');
            if (checkboxes.length === 0) return alert("병합할 노트를 1개 이상 체크해주세요.");

            const loaderId = 'unifiedLoader'; const resultWrapper = document.getElementById('unifiedResultWrapper'); const resultBox = document.getElementById('unifiedResult');
            document.getElementById(loaderId).style.display = 'block'; resultWrapper.style.display = 'none';

            let history = JSON.parse(localStorage.getItem('cozyArchive') || '[]');
            let mergedContent = ""; 
            checkboxes.forEach(cb => { const item = history.find(h => h.id == cb.value); if(item) mergedContent += `\n\n[자료]: ${item.content}`; });

            let prompt = "", coverHtml = "";
            if (type === 'book') { prompt = `단권화 병합 노트 작성\n${mergedContent}\n${formattingRules}`; coverHtml = `<div class="book-cover"><h1>단권화 노트</h1></div>`; } 
            else { prompt = `실전 모의고사 출제 (정답은 하단에)\n${mergedContent}\n${formattingRules}`; coverHtml = `<div class="mock-exam-title">실전 모의고사</div>`; } 

            try {
                const aiText = await callGeminiAPI(apiKey, prompt, [], loaderId);
                resultBox.innerHTML = coverHtml + `<div>` + marked.parse(aiText) + `</div>`;
                applyTableWrapper(resultBox); 
                resultWrapper.style.display = 'block';
                if (window.MathJax) MathJax.typesetPromise([resultBox]);
                saveHistory(`[저장] ${type === 'book' ? '단권화' : '모의고사'}`, [], aiText);
            } catch (error) { resultBox.innerHTML = `<div style="color:red;">🚨 에러 발생: ${error.message}</div>`; resultWrapper.style.display = 'block'; } 
            finally { document.getElementById(loaderId).style.display = 'none'; }
        }
    </script>
