<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>문제 변형 AI</title>
    <style>
        /* 보기 편하게 약간의 디자인(CSS)을 추가했습니다 */
        body { font-family: sans-serif; padding: 20px; }
        #resultArea { margin-top: 20px; padding: 15px; background-color: #f0f0f0; border-radius: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>기출문제 업로드 및 변형</h1>
    
    <!-- 1. API 키 입력칸 추가 -->
    <input type="password" id="apiKeyInput" placeholder="Gemini API 키를 입력하세요" style="width: 300px;"><br><br>

    <!-- 2. 이미지 업로드 및 실행 버튼 -->
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="startVisionAI()">문제 변형하기</button>
    
    <p id="statusMessage">여기에 진행 상황이 표시됩니다.</p>

    <!-- 3. AI의 답변이 출력될 공간 -->
    <div id="resultArea">AI의 답변이 여기에 나옵니다.</div>

    <script>
        // 사진 파일을 AI가 읽을 수 있는 텍스트(Base64)로 바꿔주는 마법의 함수입니다.
        function fileToGenerativePart(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    resolve({
                        inlineData: {
                            data: reader.result.split(",")[1],
                            mimeType: file.type
                        }
                    });
                };
                reader.readAsDataURL(file);
            });
        }

        async function startVisionAI() {
            const apiKey = document.getElementById('apiKeyInput').value;
            const fileInput = document.getElementById('imageInput');
            const statusMessage = document.getElementById('statusMessage');
            const resultArea = document.getElementById('resultArea');

            // 확인 절차
            if (!apiKey) {
                alert("API 키를 먼저 입력해주세요!");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("기출문제나 도표 이미지를 업로드해주세요!");
                return;
            }

            const uploadedImage = fileInput.files[0];
            statusMessage.innerText = "이미지를 AI에게 전송하고 문제를 만드는 중입니다... (약 10~20초 소요)";
            statusMessage.style.color = "blue";
            resultArea.innerText = "로딩 중...";

            try {
                // 1. 이미지를 AI용으로 변환
                const imagePart = await fileToGenerativePart(uploadedImage);
                
                // 2. AI에게 내릴 명령 (프롬프트)
                const prompt = "이 이미지에 있는 문제나 도표를 정확히 분석하고, 비슷한 유형의 변형 문제를 하나 만들어줘. 해설도 함께 적어줘.";

                // 3. Gemini AI에게 데이터 전송 (fetch)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [ {text: prompt}, imagePart ]
                        }]
                    })
                });

                // 4. 결과 받아오기
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message); // 에러가 났을 때 처리
                }

                // 5. 화면에 출력하기
                const resultText = data.candidates[0].content.parts[0].text;
                resultArea.innerText = resultText;
                statusMessage.innerText = "문제 변형 완료!";
                statusMessage.style.color = "green";

            } catch (error) {
                statusMessage.innerText = "에러가 발생했습니다 ㅠㅠ";
                statusMessage.style.color = "red";
                resultArea.innerText = "상세 에러 내용: " + error.message;
            }
        }
    </script>
</body>
</html>
