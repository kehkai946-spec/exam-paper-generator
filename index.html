<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 맞춤형 시험지 생성기</title>
    <!-- 마크다운 변환 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 15px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        #loading { display: none; text-align: center; font-weight: bold; color: #007bff; margin-top: 15px; }
        #result { background: #fff; padding: 30px; border-radius: 12px; border-top: 5px solid #007bff; display: none; }
    </style>
</head>
<body>

    <h1>📝 AI 맞춤형 시험지 생성기</h1>

    <div class="card">
        <label>🔑 Gemini API 키 입력</label>
        <input type="password" id="apiKey" placeholder="Google AI Studio에서 발급받은 API 키를 입력하세요">
        
        <label>📚 출제 지시사항 (프롬프트)</label>
        <textarea id="promptInput" rows="5" placeholder="예: 주어진 범위에서 수능형 객관식 3문제와 내신형 서술형 1문제를 출제해 줘."></textarea>
        
        <label>🔗 참고 텍스트 (직접 복사-붙여넣기)</label>
        <textarea id="contextInput" rows="4" placeholder="시험 범위에 해당하는 텍스트나 지문을 여기에 붙여넣으세요."></textarea>

        <button onclick="generateExam()">🚀 시험지 생성 시작</button>
        <div id="loading">AI가 완벽한 한국어 시험지를 출제하고 있습니다... ⏳</div>
    </div>

    <div id="result" class="card"></div>

    <script>
        async function generateExam() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('promptInput').value;
            const context = document.getElementById('contextInput').value;
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');

            if (!apiKey || !prompt) {
                alert("API 키와 출제 지시사항을 모두 입력해주세요!");
                return;
            }

            loading.style.display = "block";
            resultDiv.style.display = "none";

            // 시스템 프롬프트 + 사용자 프롬프트 결합
            const finalPrompt = `당신은 대한민국 최고의 시험 출제 위원입니다. 
다음 지시사항과 텍스트를 바탕으로 완벽한 한국어로 문제를 출제하세요.
문제, 정답, 상세한 해설(오답 노트 포함)을 명확히 구분하여 마크다운으로 작성하세요.

[출제 지시사항]: ${prompt}
[참고 텍스트]: ${context}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiText = data.candidates[0].content.parts[0].text;
                resultDiv.innerHTML = marked.parse(aiText); // 마크다운 렌더링
                resultDiv.style.display = "block";

            } catch (error) {
                alert("오류가 발생했습니다: " + error.message);
            } finally {
                loading.style.display = "none";
            }
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 맞춤형 시험지 생성기</title>
    
    <!-- 1. 깔끔한 웹 폰트 적용 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <!-- 2. 마크다운 변환 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 3. 수학 수식 렌더링 라이브러리 (MathJax) -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            line-height: 1.6; 
            padding: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
        }
        h1 { text-align: center; color: #2c3e50; font-weight: 800; }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }
        label { font-weight: 600; display: block; margin-bottom: 8px; color: #555; }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #007bff; }
        
        .btn-group { display: flex; gap: 10px; }
        button { 
            background-color: #2c3e50; 
            color: white; 
            border: none; 
            padding: 15px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            flex: 1;
            transition: all 0.2s; 
        }
        button:hover { background-color: #1a252f; transform: translateY(-2px); }
        .print-btn { background-color: #007bff; display: none; }
        .print-btn:hover { background-color: #0056b3; }
        
        #loading { display: none; text-align: center; font-weight: bold; color: #007bff; margin-top: 15px; }
        #result { background: #fff; padding: 40px; border-radius: 12px; display: none; line-height: 1.8; }
        
        /* 4. PDF 인쇄용 스타일 (출력할 땐 입력창 숨기고 문제만 보이게) */
        @media print {
            body { background-color: white; margin: 0; padding: 0; }
            .input-section, h1 { display: none !important; }
            #result { border: none; box-shadow: none; padding: 0; display: block; }
        }
    </style>
</head>
<body>

    <h1>📝 맞춤형 시험지 생성 랩 (Lab)</h1>

    <div class="card input-section">
        <label>🔑 Gemini API 키</label>
        <input type="password" id="apiKey" placeholder="API 키를 입력하세요">
        
        <label>📚 출제 지시사항 (프롬프트)</label>
        <textarea id="promptInput" rows="4" placeholder="예: 주어진 텍스트에서 상징적 의미를 묻는 서술형 1문제와, 공통수학 공식 적용 객관식 2문제를 출제해 줘."></textarea>
        
        <label>🔗 참고 텍스트 (범위 입력)</label>
        <textarea id="contextInput" rows="4" placeholder="시험 범위 텍스트나 문학 지문 등을 붙여넣으세요."></textarea>

        <div class="btn-group">
            <button onclick="generateExam()">🚀 시험지 생성하기</button>
            <button class="print-btn" id="printBtn" onclick="window.print()">🖨️ PDF로 저장 / 인쇄</button>
        </div>
        <div id="loading">AI가 텍스트를 분석하고 완벽한 시험지를 출제 중입니다... ⏳</div>
    </div>

    <div id="result" class="card"></div>

    <script>
        async function generateExam() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('promptInput').value;
            const context = document.getElementById('contextInput').value;
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            const printBtn = document.getElementById('printBtn');

            if (!apiKey || !prompt) {
                alert("API 키와 출제 지시사항을 확인해주세요!");
                return;
            }

            loading.style.display = "block";
            resultDiv.style.display = "none";
            printBtn.style.display = "none";

            const finalPrompt = `당신은 대한민국 최고의 고등학교 시험 출제 위원입니다. 
다음 지시사항과 텍스트를 바탕으로 완벽한 한국어로 문제를 출제하세요.
수학 기호나 수식이 있다면 반드시 LaTeX 형식($수식$, $$수식$$)을 사용하세요.
문제, 정답, 상세한 해설을 명확히 구분하여 마크다운으로 작성하세요.

[출제 지시사항]: ${prompt}
[참고 텍스트]: ${context}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const aiText = data.candidates[0].content.parts[0].text;
                
                // 마크다운 렌더링 후 화면에 표시
                resultDiv.innerHTML = marked.parse(aiText); 
                resultDiv.style.display = "block";
                printBtn.style.display = "block"; // 인쇄 버튼 활성화

                // 수식이 있다면 MathJax로 다시 렌더링
                if (window.MathJax) {
                    MathJax.typesetPromise([resultDiv]);
                }

            } catch (error) {
                alert("오류가 발생했습니다: " + error.message);
            } finally {
                loading.style.display = "none";
            }
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Lab Pro</title>
    
    <!-- 웹 폰트 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <!-- 아이콘 (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* 헤더 & 탭 */
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-weight: 800; font-size: 2.2rem; color: var(--text-main); margin-bottom: 10px; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; font-size: 1.1rem; font-weight: 600; color: var(--text-muted); padding: 10px 20px; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        /* 카드 UI */
        .card { background: var(--card-bg); padding: 35px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 25px; transition: opacity 0.3s ease; }
        
        /* 입력 폼 */
        .form-group { margin-bottom: 25px; }
        label { font-weight: 700; display: block; margin-bottom: 10px; color: var(--text-main); font-size: 0.95rem; }
        input[type="password"], input[type="text"], textarea, select { 
            width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 10px; 
            font-size: 1rem; font-family: inherit; transition: border-color 0.2s; box-sizing: border-box; background-color: #fcfcfc;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); background-color: #fff; }
        
        .flex-row { display: flex; gap: 15px; }
        .flex-row .form-group { flex: 1; }

        /* 버튼 */
        button.action-btn { 
            background-color: var(--primary); color: white; border: none; padding: 16px 24px; 
            border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 700; width: 100%; 
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        button.action-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2); }
        button.secondary-btn { background-color: #10b981; margin-top: 15px; }
        button.secondary-btn:hover { background-color: #059669; }
        
        /* 로딩 애니메이션 */
        #loading { display: none; text-align: center; font-weight: 600; color: var(--primary); padding: 20px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(37,99,235,0.3); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s ease-in-out infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 결과창 */
        #result-section { display: none; }
        .exam-paper { padding: 40px; background: white; border-radius: 12px; border-top: 6px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); font-size: 1.05rem; }
        .exam-paper h2, .exam-paper h3 { color: #1e293b; margin-top: 30px; }
        .exam-paper blockquote { border-left: 4px solid var(--primary); background: #f0fdf4; padding: 15px; margin: 20px 0; border-radius: 0 8px 8px 0; }
        
        /* 보관함 */
        #archive-section { display: none; }
        .history-item { padding: 20px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; }
        .history-item:hover { border-color: var(--primary); background-color: #f8fafc; }
        
        /* 인쇄 최적화 */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .exam-paper { border: none; box-shadow: none; padding: 0; }
            .exam-paper blockquote { background: transparent; border-color: #ccc; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header no-print">
            <h1><i class="fa-solid fa-flask"></i> AI Exam Lab Pro</h1>
            <p style="color: var(--text-muted);">가장 진보된 맞춤형 시험지 생성 및 아카이브 시스템</p>
        </div>

        <!-- 탭 네비게이션 -->
        <div class="tabs no-print">
            <button class="tab-btn active" onclick="switchTab('create')">새 시험지 만들기</button>
            <button class="tab-btn" onclick="switchTab('archive')">보관함 (기록)</button>
        </div>

        <!-- 새 시험지 만들기 탭 -->
        <div id="create-section" class="no-print">
            <div class="card">
                <div class="form-group">
                    <label><i class="fa-solid fa-key"></i> Gemini API 키 (자동 저장)</label>
                    <input type="password" id="apiKey" placeholder="API 키를 한 번 입력하면 내 PC에 안전하게 저장됩니다.">
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label><i class="fa-solid fa-layer-group"></i> 출제 유형</label>
                        <select id="examType">
                            <option value="객관식 위주 (수능형)">수능형 객관식 위주</option>
                            <option value="서술형 위주 (내신형)">내신형 서술형/논술형 위주</option>
                            <option value="객관식/서술형 혼합">객관식/서술형 밸런스 혼합</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-chart-simple"></i> 난이도 설정</label>
                        <select id="difficulty">
                            <option value="최상 (킬러 문항 포함, 심층 추론)">최상 (킬러 문항 포함)</option>
                            <option value="상 (응용 및 복합 개념)" selected>상 (응용 및 복합 개념)</option>
                            <option value="중 (기본 개념 및 표준 적용)">중 (기본 개념 확인)</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fa-solid fa-pen-nib"></i> 핵심 지시사항</label>
                    <textarea id="promptInput" rows="2" placeholder="예: 공통수학1 복소수와 좌표평면의 논리적 증명 과정, 또는 문학 지문에서 화자의 심리 변화 출제"></textarea>
                </div>
                
                <div class="form-group">
                    <label><i class="fa-solid fa-file-lines"></i> 시험 범위 텍스트 (지문, 개념 등)</label>
                    <textarea id="contextInput" rows="5" placeholder="분석할 문학 지문, 생명과학 실험 데이터(예: 천연 추출물 항균 효과 결과치), 또는 수학 개념을 자유롭게 붙여넣으세요."></textarea>
                </div>

                <button class="action-btn" onclick="generateExam()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 고품질 시험지 출제하기
                </button>
                <div id="loading"><div class="spinner"></div>AI가 복합적인 논리를 구성하여 문제를 설계하고 있습니다...</div>
            </div>
        </div>

        <!-- 결과창 -->
        <div id="result-section">
            <div class="exam-paper" id="result-content"></div>
            <button class="action-btn secondary-btn no-print" onclick="window.print()">
                <i class="fa-solid fa-print"></i> PDF로 깔끔하게 저장 및 인쇄
            </button>
        </div>

        <!-- 보관함 탭 -->
        <div id="archive-section" class="no-print card">
            <h2><i class="fa-solid fa-box-archive"></i> 최근 생성된 시험지</h2>
            <div id="history-list">기록이 없습니다.</div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 API 키 복구
        window.onload = function() {
            const savedKey = localStorage.getItem('geminiApiKey');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            loadHistory();
        };

        // 탭 전환 로직
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if(tab === 'create') {
                document.getElementById('create-section').style.display = 'block';
                document.getElementById('archive-section').style.display = 'none';
                document.getElementById('result-section').style.display = 'none';
            } else {
                document.getElementById('create-section').style.display = 'none';
                document.getElementById('archive-section').style.display = 'block';
                document.getElementById('result-section').style.display = 'none';
                loadHistory();
            }
        }

        // 시험지 생성 핵심 로직
        async function generateExam() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('promptInput').value;
            const context = document.getElementById('contextInput').value;
            const examType = document.getElementById('examType').value;
            const difficulty = document.getElementById('difficulty').value;

            if (!apiKey || !prompt) {
                alert("API 키와 핵심 지시사항을 입력해주세요.");
                return;
            }

            // API 키 저장 (보안을 위해 로컬 스토리지에만 저장)
            localStorage.setItem('geminiApiKey', apiKey);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';

            // 고도화된 시스템 프롬프트 (엔지니어링)
            const finalPrompt = `
당신은 대한민국 1타 강사이자 수능/내신 최고 출제 위원입니다. 
아래의 조건과 제공된 텍스트를 완벽하게 분석하여 최고 품질의 시험지를 생성하세요.

[출제 설정]
- 문제 유형 비율: ${examType}
- 난이도 수준: ${difficulty}

[핵심 지시사항]: ${prompt}
[참고 텍스트/데이터]: ${context}

[필수 엄수 포맷 및 규칙]
1. 최상단에 적절한 <시험지 제목>을 작성하세요.
2. [문제지 파트]와 [정답 및 상세 해설 파트]를 명확한 구분선(---)으로 나누어 작성하세요.
3. 객관식 문항은 1번부터 5번까지 선지를 구성하며, 오답 선지는 단순한 틀린 말이 아니라 학생이 헷갈릴 수 있는 '매력적이고 논리적인 오답'으로 설계하세요.
4. 서술형 문항은 채점 기준(부분 점수 배점 포함)을 해설 파트에 반드시 명시하세요.
5. 수학 기호, 수식, 방정식이 포함된 경우 예외 없이 완벽한 LaTeX 문법 (인라인은 $수식$, 독립 단락은 $$수식$$)을 적용하세요.
6. 학생을 존중하되 학술적이고 명확한 어조로 완벽한 한국어로 출력하세요.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        generationConfig: { temperature: 0.7 } // 창의성과 논리성의 밸런스
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiText = data.candidates[0].content.parts[0].text;
                
                // 결과 표시
                const resultContent = document.getElementById('result-content');
                resultContent.innerHTML = marked.parse(aiText);
                document.getElementById('result-section').style.display = 'block';

                // 수식 렌더링
                if (window.MathJax) MathJax.typesetPromise([resultContent]);

                // 히스토리 저장
                saveHistory(prompt, aiText);

            } catch (error) {
                alert("오류 발생: " + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 로컬 스토리지에 기록 저장
        function saveHistory(title, markdownContent) {
            let history = JSON.parse(localStorage.getItem('examHistory') || '[]');
            const newItem = {
                id: Date.now(),
                date: new Date().toLocaleDateString('ko-KR') + " " + new Date().toLocaleTimeString('ko-KR'),
                title: title.substring(0, 30) + (title.length > 30 ? "..." : ""),
                content: markdownContent
            };
            history.unshift(newItem); // 최신 항목을 앞에 추가
            if (history.length > 10) history.pop(); // 최대 10개만 유지
            localStorage.setItem('examHistory', JSON.stringify(history));
        }

        // 보관함 목록 불러오기
        function loadHistory() {
            const listContainer = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('examHistory') || '[]');
            
            if (history.length === 0) {
                listContainer.innerHTML = "<p style='color:#64748b;'>아직 생성된 시험지가 없습니다.</p>";
                return;
            }

            listContainer.innerHTML = history.map(item => `
                <div class="history-item" onclick="viewHistory(${item.id})">
                    <h3 style="margin:0 0 5px 0; color:#1e293b;"><i class="fa-regular fa-file-lines"></i> ${item.title}</h3>
                    <small style="color:#64748b;">생성일시: ${item.date}</small>
                </div>
            `).join('');
        }

        // 보관함 항목 보기
        function viewHistory(id) {
            let history = JSON.parse(localStorage.getItem('examHistory') || '[]');
            const item = history.find(h => h.id === id);
            if (item) {
                const resultContent = document.getElementById('result-content');
                resultContent.innerHTML = marked.parse(item.content);
                if (window.MathJax) MathJax.typesetPromise([resultContent]);
                
                document.getElementById('archive-section').style.display = 'none';
                document.getElementById('result-section').style.display = 'block';
            }
        }
    </script>
</body>
</html>
